name: CD

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

permissions:
  contents: read

env:
  RENDER_CLI_VERSION: 2.13.0

jobs:
  deploy-frontend:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy frontend to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-backend:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_WORKSPACE_ID: ${{ secrets.RENDER_WORKSPACE_ID }}
      RENDER_OUTPUT: json
      CI: true
    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Render CLI
        run: |
          tmpdir="$(mktemp -d)"
          curl -L https://github.com/render-oss/cli/releases/download/v${RENDER_CLI_VERSION}/cli_${RENDER_CLI_VERSION}_linux_amd64.zip -o render.zip
          unzip -o -q render.zip -d "$tmpdir"
          sudo install "$tmpdir/cli_v${RENDER_CLI_VERSION}" /usr/local/bin/render

      - name: Validate Render blueprint
        run: render blueprints validate render.yaml --workspace ${{ secrets.RENDER_WORKSPACE_ID }} --output json --confirm

      - name: Deploy backend to Render
        run: |
          render deploys create ${{ secrets.RENDER_SERVICE_ID }} \
            --commit ${{ github.event.workflow_run.head_sha }} \
            --wait \
            --output json \
            --confirm
